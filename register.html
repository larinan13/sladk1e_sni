<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Регистрация - Светлые Сны</title>
</head>
<body class="container">
<header class="d-flex flex-wrap justify-content-center py-3">
    <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
        <span class="fs-4 mx-2 fw-medium">Светлые Сны</span>
    </a>
    <ul class="nav">
        <li class="nav-item"> Приезжайте как гости, уезжайте как друзья!</li>
        <li class="nav-item"><a href="login.html" class="nav-link">Войти</a></li>
    </ul>
</header>

<div id="flashContainer"></div>

<main>
    <div class="d-flex justify-content-between flex-wrap align-items-center">
        <h1>Регистрация</h1>
    </div>

    <form class="my-2" novalidate id="registerForm">
        <div class="my-2">
            <label for="regUsername" class="form-label">Логин</label>
            <input type="text" class="form-control" id="regUsername" name="username" required>
        </div>
        <div class="my-2">
            <label for="regPassword" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="regPassword" name="password" required>
        </div>
        <div class="my-2">
            <label for="regPassword2" class="form-label">Повторите пароль</label>
            <input type="password" class="form-control" id="regPassword2" name="password2" required>
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
            <a href="login.html" class="btn btn-outline-secondary">Уже есть аккаунт? Войти</a>
        </div>
    </form>
</main>

<footer class="py-2 my-2">
    <ul class="nav justify-content-between align-items-center">
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">ул. г.Москва, ул. Ивовая, 48</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">Время работы: Пн-Пт, с 8:00-17:00</a></li>
        <li class="nav-item"><a href="tel:88005553535" class="nav-link text-body-secondary">тел. 8 (800) 555 - 35 - 35</a></li>
        <li class="nav-item"><a href="mailto:обращения@СветлыеСны.рф" class="nav-link text-body-secondary">Email: обращения@СветлыеСны.рф</a></li>
    </ul>
</footer>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
